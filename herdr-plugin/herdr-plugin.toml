# The herdr plugin nm-watch opens runs through. `nm-watch herdr-setup`
# links it. It declares one popup pane and nothing else: no actions, startup
# hooks, event hooks, or keybindings.
id = "nm-watch"
name = "nm-watch"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Open a no-mistakes run from the nm-watch board in a popup"
platforms = ["linux", "macos"]

[[panes]]
id = "view"
title = "no-mistakes run · esc closes, the run keeps going"
placement = "popup"
width = "90%"
height = "90%"
command = ["sh", "view.sh"]
